name: Test branches
on: 
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  validate-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x script.sh

      - name: Run script
        run: ./script.sh

      - name: Verify output file exists
        run: |
          if [ -f "output/message.txt" ]; then
            echo "Output file creates successfully"
            cat output/message.txt
          else
            echo "Output file missing"
            exit 1
          fi
